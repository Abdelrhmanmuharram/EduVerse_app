name: edusync_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.4
  flutter_svg: ^2.2.3
  dotted_border: ^2.0.0+3
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.4.0
  lottie: ^3.3.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  connectivity_plus: ^7.1.1
  flutter_launcher_icons: ^0.14.4
  file_picker: ^10.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

